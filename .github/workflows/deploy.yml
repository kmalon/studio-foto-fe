name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  # sent by the assets repo after a merge to main (rebuilds only when .env ASSETS_SOURCE=external)
  repository_dispatch:
    types: [assets-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # External assets source (used only when .env ASSETS_SOURCE=external)
  ASSETS_REPO: amalonart/studio_foto_assets
  ASSETS_REF: main

jobs:
  # reads ASSETS_SOURCE / ASSETS_DIR from the tracked .env
  config:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.assets.outputs.source }}
      dir: ${{ steps.assets.outputs.dir }}
    steps:
      - name: Checkout .env
        uses: actions/checkout@v4
        with:
          sparse-checkout: .env
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Read assets config
        id: assets
        run: |
          read_env() { { grep -E "^$1=" .env || true; } | tail -1 | cut -d= -f2- | tr -d "\r\"' "; }
          SOURCE="$(read_env ASSETS_SOURCE)"; SOURCE="${SOURCE:-internal}"
          DIR="$(read_env ASSETS_DIR)"; DIR="${DIR:-./src/assets_external}"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Assets source: $SOURCE (external dir: $DIR)"

  build:
    needs: config
    # assets repo dispatch -> rebuild only with external assets; push / manual always build
    if: github.event_name != 'repository_dispatch' || needs.config.outputs.source == 'external'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Checkout external assets
        if: needs.config.outputs.source == 'external'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ASSETS_REPO }}
          ref: ${{ env.ASSETS_REF }}
          path: .assets-repo
          sparse-checkout: assets
          fetch-depth: 1
      - name: Place external assets
        if: needs.config.outputs.source == 'external'
        env:
          DIR: ${{ needs.config.outputs.dir }}
        run: |
          rm -rf "$DIR"
          mkdir -p "$(dirname "$DIR")"
          mv .assets-repo/assets "$DIR"
          rm -rf .assets-repo
          test -f "$DIR/altText.ts" || { echo "::error::$DIR/altText.ts missing in fetched assets"; exit 1; }
          ls -la "$DIR"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [config, build]
    # assets repo dispatch -> deploy only with external assets; push / manual always deploy
    if: github.event_name != 'repository_dispatch' || needs.config.outputs.source == 'external'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
