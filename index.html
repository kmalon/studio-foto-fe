<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Studio Foto — fotografia ślubna i portretowa w stylu reportażowym. Kraków i cała Polska."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0d0d'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='18' fill='%23c9a227' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <title>Studio Foto — fotografia ślubna</title>

    <!--
      TEMPORARY debug reporter — paints errors on screen for devices with no
      reachable console (phones). Deliberately ES5 and non-module so it still
      parses on browsers too old to run the app bundle. Remove once the mobile
      blank-page issue is closed; `main.tsx` feeds React errors into it.
    -->
    <script>
      (function () {
        var reported = false
        var reportCount = 0

        function esc(value) {
          return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
        }

        // Render into a body-level overlay, not #root — React clears #root when
        // it unmounts a crashed tree, which would wipe the message.
        function report(label, detail) {
          reported = true
          reportCount++
          var box = document.getElementById('debug-error')
          if (!box) {
            box = document.createElement('div')
            box.id = 'debug-error'
            box.setAttribute(
              'style',
              'position:fixed;inset:0;z-index:9999;overflow:auto;' +
                'background:#0d0d0d;color:#f2f0ed;padding:16px;' +
                'font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;' +
                'white-space:pre-wrap;word-break:break-word;'
            )
            document.body.appendChild(box)
          }
          box.innerHTML +=
            '<div style="color:#c9a227;margin-top:12px"><strong>' +
            esc(label) +
            '</strong></div>' +
            esc(detail) +
            '\n\nUA: ' +
            esc(navigator.userAgent) +
            '\n'
        }

        window.__report = report

        // Capture phase so failed <script>/<img> loads are caught too.
        window.addEventListener(
          'error',
          function (e) {
            if (e.target && e.target !== window && e.target.src) {
              report('Resource failed to load', e.target.src)
              return
            }
            report(
              'JavaScript error',
              (e.message || 'unknown') +
                '\n' +
                (e.filename || '?') +
                ':' +
                (e.lineno || 0) +
                (e.error && e.error.stack ? '\n\n' + e.error.stack : '')
            )
          },
          true
        )

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason
          report(
            'Unhandled promise rejection',
            (reason && (reason.stack || reason.message)) || String(reason)
          )
        })

        // Silent failure: no error fired, but React never rendered anything.
        setTimeout(function () {
          var root = document.getElementById('root')
          if (!reported && root && root.childElementCount === 0) {
            report(
              'App never mounted',
              'No JS error fired within 5s and #root is still empty.\n' +
                'The ES module bundle most likely never executed — browser too old ' +
                'for untranspiled dev output, or the script request failed.'
            )
            watchLateMount(root, reportCount)
          }
        }, 5000)

        // A cold dev-server load (hundreds of unbundled modules) can take longer
        // than 5s. If the app mounts later and nothing else was reported, the
        // "never mounted" warning was a false alarm — remove it.
        function watchLateMount(root, countAtStall) {
          if (!window.MutationObserver) return
          var observer = new MutationObserver(function () {
            if (root.childElementCount === 0) return
            observer.disconnect()
            var box = document.getElementById('debug-error')
            if (box && reportCount === countAtStall) {
              box.parentNode.removeChild(box)
              reported = false
            }
          })
          observer.observe(root, { childList: true })
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
