# Sveltia CMS config (https://sveltiacms.app/en/docs). Edits the assets repo, not this one;
# each commit there triggers a site rebuild (notify -> repository_dispatch assets-updated).
backend:
  name: github
  repo: amalonart/studio_foto_assets
  branch: main
  auth_methods: [token] # fine-grained PAT: studio_foto_assets, Contents read/write
  commit_messages:
    update: 'cms: zmień {{collection}} "{{slug}}"'
    uploadMedia: 'cms: dodaj plik "{{path}}"'
    deleteMedia: 'cms: usuń plik "{{path}}"'

site_url: https://angelikamalon.pl
display_url: https://angelikamalon.pl

# Global asset library: browse start/, portfolio/{full,thumbs}, about/, gallery/<sesja>/{overview.md,full,thumbial}.
# File names: NN-opis-zdjecia.webp (NN = kolejność). Alt texts: altText.ts (manual).
media_folder: assets
public_folder: /assets

# Raster uploads -> WebP, fit inside 2048x2048 (never enlarged), q90, Exif stripped.
# Mirrors convert-images.sh "full" profile (FULL_SIZE/FULL_Q). Sveltia has no per-folder transforms,
# so thumbs (portfolio/thumbs, thumbial/) get the same profile; 800px thumbs -> script. No XMP copyright.
media_libraries:
  all:
    slugify_filename: true # "01 Opis.JPG" -> 01-opis.webp (keeps NN-opis naming)
    transformations:
      raster_image:
        format: webp
        quality: 90 # FULL_Q
        width: 2048 # FULL_SIZE 2048x2048>
        height: 2048

# Never put a collection on assets/gallery: Sveltia lists a file either as a collection entry or as an asset,
# never both (and any extra asset folder there hides gallery/ from the global tree). overview.md is a plain file
# in Assets (edit locally, upload with the same name to replace; line 1 "# Tytuł", line 2 opis/meta description).
# Sveltia needs >= 1 visible collection -> raw editors for altText.ts / slideFocus.ts (they leave the Assets list).
collections:
  - name: settings
    label: Ustawienia
    format: raw # raw never mismatches the extension, whole file = body
    editor:
      preview: false
    files:
      - name: alt_text
        label: Teksty alternatywne (altText.ts)
        file: assets/altText.ts
        fields:
          - name: body
            label: altText.ts
            widget: text
            hint: 'Wpis: "<folder>/<plik>": "opis zdjęcia", (np. "gallery/4_sesja.../full/01-x.webp"). Zachowaj składnię TS (cudzysłowy, przecinki), inaczej build się nie uda.'
      - name: slide_focus
        label: Kadrowanie slajdów (slideFocus.ts)
        file: assets/slideFocus.ts
        fields:
          - name: body
            label: slideFocus.ts
            widget: text
            hint: 'Plik slajdu (start/) -> object-position, np. "30% 50%" (gdzie są ludzie na pionowym ekranie). Zachowaj składnię TS.'
